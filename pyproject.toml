[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "weak-monitor-lab"
version = "0.1.0"
description = "Environment, replay-based labels and monitor pipeline for 'Hacking or Just Failing?': can LLM monitors separate reward hacking from honest failure?"
readme = "README.md"
requires-python = ">=3.12"   # analysis.py uses PEP 701 f-strings; all runs used 3.12.3
license = { text = "MIT" }
authors = [{ name = "Kaushik Kezendirane" }]
keywords = ["reward hacking", "LLM monitoring", "AI safety", "pre-registration"]
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/KaushikKC/weak-monitor-lab"

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]
paper = ["pandas>=2"]                 # scripts/make_fig2.py only

[project.scripts]
wml = "weak_monitor_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weak_monitor_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
