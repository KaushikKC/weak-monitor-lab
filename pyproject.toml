[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "weak-monitor-lab"
version = "0.1.0"
description = "Small reproducible experiment: can a local LLM monitor detect reward hacking in a tool-using agent's trajectory?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
wml = "weak_monitor_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weak_monitor_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
