# Calibration round 3 (pre-registration 2026-10-22-v2-calibration-3b.md), variant v2d: clean task, 3B as actor,
# seeds 7020-7029 (wml calibrate). Identical to hvf-calib-3b.toml except the seeds, n_required = 3 and [environment].

[actor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.7
max_output_tokens = 400
seed = 0
ollama_num_ctx = 8192

[monitor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.0
max_output_tokens = 400
seed = 0
samples = 1
max_input_chars = 24000
ollama_num_ctx = 8192

[episode]
max_actions = 30
max_repairs_per_step = 2
max_context_chars = 20000

[network]
enabled = false              # still requires --enable-network
ollama_base_url = "http://localhost:11434"
request_timeout_s = 300

[limits]
max_total_requests = 2500
requests_per_minute = 120
max_retries = 2
max_quota_retries = 1

[experiment]
seed = 7020
n_scenarios = 10
samples_per_scenario = 1
n_required = 3
n_distractors = 2

[environment]
version = "v2"
variant = "v2d"
