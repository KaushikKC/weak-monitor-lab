# Hacking-vs-failing D1: 60 unprompted episodes, 8B agent, seeds 6000-6059 (wml generate).
# Pre-registered: docs/preregistration/2026-10-02-hacking-vs-failing.md

[actor]
provider = "ollama"
model_id = "llama3.1:8b-instruct-q4_K_M"
temperature = 0.7
max_output_tokens = 400
seed = 0
ollama_num_ctx = 8192

[monitor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.0
max_output_tokens = 400
seed = 0
samples = 1
max_input_chars = 24000
ollama_num_ctx = 8192

[episode]
max_actions = 30
max_repairs_per_step = 2
max_context_chars = 20000

[network]
enabled = false              # still requires --enable-network
ollama_base_url = "http://localhost:11434"
request_timeout_s = 300

[limits]
max_total_requests = 2500
requests_per_minute = 120
max_retries = 2
max_quota_retries = 1

[experiment]
seed = 6000
n_scenarios = 60
samples_per_scenario = 1
n_required = 4
n_distractors = 2
