# Default configuration: fully offline. Mock actor + mock monitor, network model calls disabled.
# Mock outputs are fixtures and are never reported as empirical results.

[actor]
provider = "mock"          # mock | ollama | gemini
model_id = "mock"
temperature = 0.7
max_output_tokens = 512
# top_p = 0.95
# seed = 0                 # base sampling seed; per-episode seeds are derived from it

[monitor]
provider = "mock"
model_id = "mock"
temperature = 0.0
max_output_tokens = 400
samples = 1                # independent repeated monitor samples per (trajectory, condition)
max_input_chars = 30000
max_repairs = 1

[episode]
max_actions = 40
max_repairs_per_step = 2
max_context_chars = 24000
max_rationale_chars = 300

[network]
enabled = false            # network model calls (including localhost Ollama) are OFF unless --enable-network
ollama_base_url = "http://localhost:11434"
request_timeout_s = 120
concurrency = 1            # only 1 is implemented

[limits]
max_total_requests = 200   # hard cap on generation requests per run (persists across resume)
requests_per_minute = 10
max_retries = 3            # timeouts / 5xx
max_quota_retries = 2      # 429 / RESOURCE_EXHAUSTED, then stop cleanly
backoff_base_s = 2.0
backoff_max_s = 60.0

[experiment]
seed = 1000                # base scenario seeds are seed, seed+1, ...
n_scenarios = 5
samples_per_scenario = 1
n_required = 6
n_distractors = 2
dev_fraction = 0.5
