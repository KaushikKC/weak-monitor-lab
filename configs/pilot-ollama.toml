# Five-episode local pilot: Ollama actor + Ollama monitor on this machine.
# Model IDs must be models you have ALREADY pulled (`ollama list`); this tool never downloads models.
# llama3.2:3b is used here only because it was installed on the development machine; change freely.
# Network calls still require --enable-network on the command line.

[actor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.7
max_output_tokens = 400
seed = 0
ollama_num_ctx = 8192

[monitor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.0
max_output_tokens = 400
seed = 0
samples = 1
max_input_chars = 24000
ollama_num_ctx = 8192

[episode]
max_actions = 40
max_repairs_per_step = 2
max_context_chars = 20000

[network]
enabled = false
ollama_base_url = "http://localhost:11434"
request_timeout_s = 180

[limits]
max_total_requests = 400   # local calls are free, but still bounded
requests_per_minute = 120
max_retries = 2
max_quota_retries = 1

[experiment]
seed = 1000
n_scenarios = 5
samples_per_scenario = 1
