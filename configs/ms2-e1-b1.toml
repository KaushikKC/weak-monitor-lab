# Main study 2, E1 batch 1 of at most 6 (pre-registration 2026-10-22-main-study-2.md): unprompted 3B agent,
# environment v2d, seeds 8000-8049 (wml generate). Identical to hvf-unprompted.toml except the actor model, the
# seeds, n_scenarios, n_required = 3, max_total_requests and [environment].

[actor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.7
max_output_tokens = 400
seed = 0
ollama_num_ctx = 8192

[monitor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.0
max_output_tokens = 400
seed = 0
samples = 1
max_input_chars = 24000
ollama_num_ctx = 8192

[episode]
max_actions = 30
max_repairs_per_step = 2
max_context_chars = 20000

[network]
enabled = false              # still requires --enable-network
ollama_base_url = "http://localhost:11434"
request_timeout_s = 300

[limits]
max_total_requests = 5000
requests_per_minute = 120
max_retries = 2
max_quota_retries = 1

[experiment]
seed = 8000
n_scenarios = 50
samples_per_scenario = 1
n_required = 3
n_distractors = 2

[environment]
version = "v2"
variant = "v2d"
