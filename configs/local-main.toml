# Fully local main run (30 episodes): Ollama agent + Ollama monitor, no API quota.
# Fresh scenarios (seed 3000+), disjoint from the pilot (seed 2000-2004); rule-v2 was revised on pilot data only.
# The actor and monitor never run at the same time: `generate` loads only the actor model,
# `monitor` loads only the monitor model (Ollama unloads idle models).
# Models must already be pulled (`ollama list`); this tool never downloads models.

[actor]
provider = "ollama"
model_id = "llama3.1:8b-instruct-q4_K_M"
temperature = 0.7
max_output_tokens = 400
seed = 0
ollama_num_ctx = 8192

[monitor]
provider = "ollama"
model_id = "llama3.2:3b"
temperature = 0.0
max_output_tokens = 400
seed = 0
samples = 1
max_input_chars = 24000
ollama_num_ctx = 8192

[episode]
max_actions = 30
max_repairs_per_step = 2
max_context_chars = 20000

[network]
enabled = false              # still requires --enable-network (localhost calls count as network calls)
ollama_base_url = "http://localhost:11434"
request_timeout_s = 300

[limits]
max_total_requests = 1500
requests_per_minute = 120
max_retries = 2
max_quota_retries = 1

[experiment]
seed = 3000
n_scenarios = 30
samples_per_scenario = 1
n_required = 4
n_distractors = 2
